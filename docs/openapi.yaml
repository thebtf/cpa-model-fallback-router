openapi: 3.1.0
info:
  title: CPA Model Fallback Router
  version: 0.2.0
  summary: Redoc-rendered configuration reference for the CPA model fallback router plugin.
  description: |
    This document is a configuration reference for a native CLIProxyAPI plugin.
    It is rendered with Redoc for readability; the plugin itself does not expose
    an HTTP API.
servers:
  - url: https://example.invalid/config-reference
    description: Documentation-only placeholder.
tags:
  - name: Configuration
    description: Plugin YAML configuration under `plugins.configs.model-fallback-router`.
paths:
  /plugins/configs/model-fallback-router:
    get:
      tags: [Configuration]
      summary: Documentation-only view of the plugin configuration object.
      description: This path is not a runtime HTTP endpoint. It exists so Redoc can render the configuration schemas and examples.
      responses:
        '200':
          description: Plugin configuration schema.
          content:
            application/yaml:
              schema:
                $ref: '#/components/schemas/PluginConfig'
              examples:
                claudeQuotaToGpt54:
                  summary: Claude quota fallback to GPT-5.4
                  value:
                    enabled: true
                    priority: 100
                    rules:
                      - name: claude_quota_to_gpt54
                        source_formats: [claude, anthropic]
                        models: [claude-*]
                        primary_model: "$requested"
                        fallback_models: [gpt-5.4]
                        execution_transform:
                          enabled: true
                          activation: tool_surface
                          force_tools: when_available
                          selected_model_patterns: [gpt-*]
                    execution_transform:
                      enabled: false
                      telemetry: true
                      activation: tool_surface
                      force_tools: when_available
                      execution_envelope: "Execution mode is active: execute a real state-changing tool call before prose."
                    fallback:
                      enabled: true
                      cooldown_seconds: 60
                      fallback_on_status: [401, 403, 408, 409, 429, 500, 502, 503, 504]
                      no_fallback_on_status: [400, 404, 422]
                kimiQuotaChain:
                  summary: Kimi to Grok, then GPT, on quota failures
                  value:
                    enabled: true
                    rules:
                      - name: kimi_to_grok_then_luna
                        models: [kimi-*]
                        primary_model: "$requested"
                        fallback_models: [grok-4.5, gpt-5.6-luna]
components:
  schemas:
    PluginConfig:
      type: object
      description: Runtime decoding tolerates unknown keys for CPA and legacy-config compatibility; copy documented field names exactly.
      required: [enabled, rules]
      properties:
        enabled:
          type: boolean
          description: Enables or disables the plugin logic after CPA loads the shared library.
        priority:
          type: integer
          description: CPA plugin execution priority. Higher or lower ordering depends on CPA host ordering rules.
          default: 100
        rules:
          type: array
          minItems: 1
          description: First matching rule wins. Put narrow model patterns before broader patterns.
          items:
            $ref: '#/components/schemas/FallbackRule'
        fallback:
          $ref: '#/components/schemas/FallbackPolicy'
        execution_transform:
          $ref: '#/components/schemas/ExecutionTransform'
    FallbackRule:
      type: object
      required: [name, models, fallback_models]
      properties:
        name:
          type: string
          minLength: 1
          description: Stable operator-facing rule name used in diagnostics.
        source_formats:
          type: array
          items:
            type: string
            enum: [claude, anthropic, openai, openai-response, gemini, codex, antigravity]
          description: Optional inbound protocol filter. `anthropic` is normalized to `claude`.
        models:
          type: array
          minItems: 1
          items:
            type: string
          description: Requested model patterns. Supports `*` wildcards.
          examples:
            - [claude-*]
        primary_model:
          type: string
          default: "$requested"
          description: First model to attempt. `$requested` means the model from the client request.
        fallback_models:
          type: array
          minItems: 1
          items:
            type: string
          description: Ordered model names to try after fallback-eligible failures. Each attempt must be fallback eligible before the next model is tried. Models may target any CPA-supported provider; CPA host execution keeps request/response conversion in the built-in translator pipeline.
          examples:
            - [gpt-5.4]
            - [grok-4.5, gpt-5.6-luna]
        cooldown_seconds:
          type: integer
          minimum: 0
          description: Optional rule-level override for primary-model cooldown seconds. `0` disables cooldown for this rule.
        fallback_on_status:
          type: array
          items:
            type: integer
            minimum: 100
            maximum: 599
          description: Optional rule-level override for fallback-eligible HTTP statuses.
        no_fallback_on_status:
          type: array
          items:
            type: integer
            minimum: 100
            maximum: 599
          description: Optional rule-level override for statuses that must not fall back.
        execution_transform:
          $ref: '#/components/schemas/ExecutionTransform'
          description: Optional rule-level override for the execution transform. Omitted fields inherit global execution_transform settings.
    FallbackPolicy:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
          description: Enables fallback evaluation after a primary failure.
        cooldown_seconds:
          type: integer
          minimum: 0
          default: 60
          description: Seconds to skip the primary model after a fallback-eligible primary failure. `0` disables cooldown.
        fallback_on_status:
          type: array
          default: [401, 403, 408, 409, 429, 500, 502, 503, 504]
          items:
            type: integer
            minimum: 100
            maximum: 599
          description: HTTP statuses that should trigger fallback unless blocked by `no_fallback_on_status`.
        no_fallback_on_status:
          type: array
          default: [400, 404, 422]
          items:
            type: integer
            minimum: 100
            maximum: 599
          description: HTTP statuses that should never trigger fallback.
    ExecutionTransform:
      type: object
      description: Optional agent-harness execution transform for non-native or same-model attempts. Disabled by default.
      properties:
        enabled:
          type: boolean
          default: false
          description: Enables execution-mode request transforms for matching attempts.
        dry_run:
          type: boolean
          default: false
          description: Emits transform metadata without mutating the request body.
        telemetry:
          type: boolean
          default: true
          description: Emits decision metadata without raw prompts, tool schemas, or request bodies.
        activation:
          type: string
          enum: [tool_surface, always]
          default: tool_surface
          description: Controls how a matched rule activates the transform. `tool_surface` uses protocol shape plus available tools instead of prompt phrases; `always` applies to every matched request.
        force_tools:
          type: string
          enum: [never, when_available, always_if_supported]
          default: when_available
          description: Controls whether supported protocol shapes receive required tool-choice settings.
        execution_envelope:
          type: string
          description: Optional custom instruction envelope injected into matching execution turns. Defaults to the built-in action-first envelope.
        inject_execution_envelope:
          type: boolean
          default: true
          description: Adds the configured instruction envelope telling GPT fallback attempts to act as an execution turn.
        add_audited_exit_tool:
          type: boolean
          default: true
          description: Adds an audited exit tool when tools are available or force_tools permits adding tools.
        max_envelope_chars:
          type: integer
          default: 1600
          description: Maximum envelope length. Use 0 to disable truncation; otherwise values must be 256-8000.
        source_formats:
          type: array
          default: [claude]
          items:
            type: string
          description: Inbound source formats allowed for transform detection. `anthropic` is normalized to `claude`.
        requested_model_patterns:
          type: array
          default: [claude-*]
          items:
            type: string
          description: Requested model patterns allowed for transform detection.
        selected_model_patterns:
          type: array
          default: [gpt-*]
          items:
            type: string
          description: Selected attempt model patterns allowed for transform detection.
        exit_tool:
          $ref: '#/components/schemas/AuditedExitToolSettings'
        strict:
          type: boolean
          default: false
          description: Fails before host execution when a candidate transform cannot be applied safely.
    AuditedExitToolSettings:
      type: object
      properties:
        name:
          type: string
          default: ExitContinuationTool
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
          description: Tool name used for structured audited exits from tool-required mode.
